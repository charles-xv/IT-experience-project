<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 760" width="1020" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Mech Spec LMS — System Architecture</title>
  <desc>Four-tier architecture: clients, web server, application layer with security, business logic and presentation, and the MySQL data layer, plus the external YouTube service.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1020" height="760" fill="#ffffff"/>

  <text x="510" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Mech Spec LMS — System Architecture</text>
  <text x="510" y="54" text-anchor="middle" font-size="12" fill="#64748b">Three-tier web application · PHP 8 · MySQL · Apache</text>

  <!-- ============ TIER 1: CLIENTS ============ -->
  <rect x="40" y="78" width="940" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="98" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">CLIENT TIER</text>

  <rect x="130" y="106" width="200" height="50" rx="8" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="230" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#0e7490">Student</text>
  <text x="230" y="146" text-anchor="middle" font-size="10" fill="#0891b2">browse · buy · learn</text>

  <rect x="410" y="106" width="200" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="510" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">Instructor</text>
  <text x="510" y="146" text-anchor="middle" font-size="10" fill="#d97706">publish · price · sell</text>

  <rect x="690" y="106" width="200" height="50" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="790" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">Administrator</text>
  <text x="790" y="146" text-anchor="middle" font-size="10" fill="#059669">oversee · moderate · audit</text>

  <!-- clients -> browser -->
  <line x1="510" y1="170" x2="510" y2="196" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ TIER 2: PRESENTATION ============ -->
  <rect x="40" y="198" width="940" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="218" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">PRESENTATION</text>

  <rect x="130" y="226" width="760" height="36" rx="7" fill="#ffffff" stroke="#94a3b8"/>
  <text x="510" y="243" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Browser — HTML5 · CSS3 · Vanilla JavaScript</text>
  <text x="510" y="256" text-anchor="middle" font-size="10" fill="#64748b">responsive, mobile-first · no framework · no build step</text>

  <line x1="510" y1="274" x2="510" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="524" y="292" font-size="10" fill="#64748b">HTTPS request / response</text>

  <!-- ============ TIER 3: APPLICATION ============ -->
  <rect x="40" y="302" width="940" height="286" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="58" y="322" font-size="11" font-weight="700" fill="#475569" letter-spacing="1">APPLICATION TIER — Apache · PHP 8.2</text>

  <!-- Security layer, drawn first because every request passes through it -->
  <rect x="62" y="332" width="896" height="66" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="80" y="352" font-size="11" font-weight="700" fill="#b91c1c">SECURITY LAYER — every protected request passes through here first</text>
  <text x="80" y="371" font-size="10.5" fill="#7f1d1d">SessionGuard.php · role check (RBAC) · 30-min idle timeout · no-store cache headers</text>
  <text x="80" y="387" font-size="10.5" fill="#7f1d1d">Login.php · bcrypt verify · rate limiting (3 tries / 15-min lock / 24-h window) · session regeneration</text>

  <!-- Page layer -->
  <rect x="62" y="410" width="436" height="76" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="80" y="430" font-size="11" font-weight="700" fill="#334155">PAGES (render HTML)</text>
  <text x="80" y="449" font-size="10" fill="#475569">Index · Login · Signup · StudentDashboard</text>
  <text x="80" y="464" font-size="10" fill="#475569">InstructorDashboard · AdminDashboard · BrowseCourses</text>
  <text x="80" y="479" font-size="10" fill="#475569">WatchCourse · Cart · Checkout · Certificates · Settings</text>

  <!-- Handler layer -->
  <rect x="522" y="410" width="436" height="76" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="540" y="430" font-size="11" font-weight="700" fill="#334155">HANDLERS (process, then redirect)</text>
  <text x="540" y="449" font-size="10" fill="#475569">Signup · Login · Logout · SaveCourse · UpdateCourse</text>
  <text x="540" y="464" font-size="10" fill="#475569">DeleteCourse · AddToCart · ProcessPayment · AdminAction</text>
  <text x="540" y="479" font-size="10" fill="#475569">UpdateProgress · UpdateProfile · UpdatePassword</text>

  <!-- Shared services -->
  <rect x="62" y="498" width="896" height="74" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="80" y="518" font-size="11" font-weight="700" fill="#1d4ed8">SHARED SERVICES</text>
  <text x="80" y="537" font-size="10.5" fill="#1e40af">Database.php — single PDO connection · prepared statements enforced (emulation off)</text>
  <text x="80" y="553" font-size="10.5" fill="#1e40af">Helpers.php — security event logging · page-visit logging · output escaping</text>
  <text x="80" y="568" font-size="10.5" fill="#1e40af">Transactions wrap multi-row writes (checkout) so partial states cannot occur</text>

  <!-- app -> data -->
  <line x1="380" y1="588" x2="380" y2="620" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="394" y="610" font-size="10" fill="#64748b">PDO · prepared statements</text>

  <!-- app -> youtube -->
  <line x1="800" y1="588" x2="800" y2="620" stroke="#b45309" stroke-width="1.6" marker-end="url(#arwGold)"/>

  <!-- ============ TIER 4: DATA ============ -->
  <rect x="40" y="622" width="640" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="642" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">DATA TIER — MySQL / MariaDB · InnoDB · utf8mb4</text>

  <rect x="58" y="652" width="140" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="128" y="666" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Users</text>
  <text x="128" y="678" text-anchor="middle" font-size="9" fill="#64748b">role · status</text>

  <rect x="208" y="652" width="140" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="278" y="666" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Courses</text>
  <text x="278" y="678" text-anchor="middle" font-size="9" fill="#64748b">price · video · status</text>

  <rect x="358" y="652" width="140" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="428" y="666" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Enrollments</text>
  <text x="428" y="678" text-anchor="middle" font-size="9" fill="#64748b">progress</text>

  <rect x="508" y="652" width="150" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="583" y="666" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">CartItems · Purchases</text>
  <text x="583" y="678" text-anchor="middle" font-size="9" fill="#64748b">reference · amount</text>

  <rect x="58" y="694" width="200" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="158" y="708" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Certificates</text>
  <text x="158" y="720" text-anchor="middle" font-size="9" fill="#64748b">issued on completion</text>

  <rect x="268" y="694" width="200" height="34" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="368" y="708" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">SecurityLogs · LoginAttempts</text>
  <text x="368" y="720" text-anchor="middle" font-size="9" fill="#7f1d1d">audit trail</text>

  <rect x="478" y="694" width="180" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="568" y="708" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">PageVisits · Lessons</text>
  <text x="568" y="720" text-anchor="middle" font-size="9" fill="#64748b">analytics · structure</text>

  <!-- ============ EXTERNAL ============ -->
  <rect x="700" y="622" width="280" height="118" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="718" y="642" font-size="11" font-weight="700" fill="#b45309" letter-spacing="1">EXTERNAL SERVICE</text>

  <rect x="718" y="654" width="244" height="66" rx="7" fill="#ffffff" stroke="#f59e0b"/>
  <text x="840" y="674" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">YouTube</text>
  <text x="840" y="691" text-anchor="middle" font-size="9.5" fill="#92400e">iframe embed for lesson video</text>
  <text x="840" y="706" text-anchor="middle" font-size="9.5" fill="#92400e">img.youtube.com for thumbnails</text>
</svg>
